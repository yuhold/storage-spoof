name: Publish Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/storage-spoof-release.p12"
          echo "ANDROID_SIGNING_STORE_FILE=$ANDROID_SIGNING_STORE_FILE" >> "$GITHUB_ENV"
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
          chmod 600 "$ANDROID_SIGNING_STORE_FILE"

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(perl -ne 'print "$1\n" if /versionName\s*=\s*"([^"]+)"/' app/build.gradle.kts)"
          test -n "$version_name"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version_name" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version_name" >&2
            exit 1
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Test, lint, and build signed APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Verify and package release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.name }}"
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$source_apk"

          build_tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$source_apk"

          mkdir -p release-assets
          universal="release-assets/StorageSpoof-${version}-universal.apk"
          arm64="release-assets/StorageSpoof-${version}-arm64-v8a.apk"
          cp "$source_apk" "$universal"
          cp "$source_apk" "$arm64"
          (
            cd release-assets
            sha256sum *.apk > "StorageSpoof-${version}-checksums.txt"
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorageSpoof-${{ steps.version.outputs.name }}
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "StorageSpoof ${{ steps.version.outputs.name }}" \
            --generate-notes \
            --verify-tag
